# Next.js CesiumJS 3D GIS Kit: Nginx reverse proxy in front of `next start` on 127.0.0.1:3000.
#
# Install:  sudo cp deploy/nginx/gis-kit.conf /etc/nginx/sites-available/gis-kit.conf
#           sudo sed -i 's/gis.example.com/your.domain.example/g' /etc/nginx/sites-available/gis-kit.conf
#           sudo ln -s /etc/nginx/sites-available/gis-kit.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Obtain the certificate first (see docs/deployment.md), e.g.
#   sudo certbot certonly --nginx -d gis.example.com --deploy-hook "systemctl reload nginx"
#
# Written for the Nginx 1.24 shipped with Ubuntu 24.04 (`listen ... ssl http2`). On Nginx 1.25.1+
# you may write `listen 443 ssl;` plus `http2 on;` instead.

upstream gis_kit_web {
    server 127.0.0.1:3000;
    keepalive 32;
    # Below the --keepAliveTimeout 65000 passed to `next start` (deploy/systemd/gis-kit-web.service).
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name gis.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gis.example.com;

    ssl_certificate     /etc/letsencrypt/live/gis.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gis.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:gis_kit_ssl:10m;
    ssl_session_timeout 1d;

    # Uploads arrive as 2 MB chunks plus multipart overhead; Server Actions (category icons) are
    # capped at 2 MB by next.config.ts. Anything above a few MB is not needed.
    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # next start already compresses JSON, HTML, JS and CSS (responses arriving with
    # Content-Encoding are passed through). It does not compress application/octet-stream, which
    # is how the terrain tiles are sent (decompressed by the route handler), so Nginx does that.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Proxy settings for every location below (none of them sets its own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append ($proxy_add_x_forwarded_for): the app uses the FIRST
    # X-Forwarded-For hop as the client IP for login and upload rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;
    # Large vector layers are streamed as GeoJSON; give slow clients time.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Hashed build output: Next.js already sends Cache-Control: public, max-age=31536000, immutable.
    location /_next/static/ {
        proxy_pass http://gis_kit_web;
        access_log off;
    }

    # Cesium Workers/Assets/Widgets copied to public/cesium (not hashed: the folder is replaced when
    # the Cesium version changes). Next.js serves public/ files with max-age=0; cache for a week.
    location /cesium/ {
        proxy_pass http://gis_kit_web;
        proxy_hide_header Cache-Control;
        expires 7d;
        access_log off;
    }

    location = /up {
        proxy_pass http://gis_kit_web;
        access_log off;
    }

    # Pages, Server Actions, NextAuth, the /geodata API, tiles and uploads. storage/ is never
    # served from disk: tiles, GeoJSON and icons go through authenticated route handlers.
    location / {
        proxy_pass http://gis_kit_web;
    }
}
